<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login — VeganSaathi</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link href="css/styles.css" rel="stylesheet">

  <script>
    window.VS_BASE = "";
    window.VS_ACTIVE_PAGE = "";
  </script>
</head>

<body>

  <div id="navbar-placeholder"></div>

  <section class="vs-section">
    <div class="container" style="max-width:480px;">

      <div class="vs-card p-4">

        <h1 class="h4 mb-3">Log in to VeganSaathi</h1>

        <form id="loginForm" novalidate>

          <!-- Email -->
          <div class="mb-3">
            <label for="loginEmail" class="form-label">
              Email
            </label>

            <input
              type="email"
              class="form-control"
              id="loginEmail"
              autocomplete="email"
              required
            >
          </div>

          <!-- Password -->
          <div class="mb-2">
            <label for="loginPassword" class="form-label">
              Password
            </label>

            <input
              type="password"
              class="form-control"
              id="loginPassword"
              autocomplete="current-password"
              required
            >
          </div>

          <!-- Remember + Forgot Password -->
          <div class="d-flex justify-content-between align-items-center mb-3">

            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="rememberMe"
              >

              <label
                class="form-check-label"
                for="rememberMe"
                style="font-size:0.9rem;"
              >
                Remember me
              </label>
            </div>

            <a
              href="#"
              id="forgotPasswordLink"
              style="font-size:0.9rem;"
            >
              Forgot password?
            </a>

          </div>

          <!-- Login -->
          <button
            type="submit"
            class="btn btn-vs-primary w-100 mb-2"
          >
            Login
          </button>

          <!-- Google -->
          <button
            type="button"
            id="googleSignInButton"
            class="btn btn-vs-outline w-100"
          >
            Sign in with Google
          </button>

          <!-- Feedback -->
          <div
            id="loginFeedback"
            class="vs-form-note mt-3 d-none"
          ></div>

        </form>

        <p
          class="text-center mt-3 mb-0"
          style="font-size:0.9rem;"
        >
          New to VeganSaathi?
          <a href="register.html">Create an account</a>
        </p>

      </div>

    </div>
  </section>

  <div id="footer-placeholder"></div>

  <!-- Bootstrap -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- Existing VeganSaathi scripts -->
  <script src="js/mock-data.js"></script>
  <script src="js/components.js"></script>
  <script type="module" src="js/app.js"></script>

  <!-- Phase 4 Firebase Authentication -->
  <!-- IMPORTANT: load only once and as a module -->
  <script type="module" src="js/auth-ui.js"></script>

</body>
</html>
