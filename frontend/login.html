<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — VeganSaathi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <script>
    window.VS_BASE = "";
    window.VS_ACTIVE_PAGE = "";
  </script>
</head>

<body>

  <div id="navbar-placeholder"></div>

  <section class="vs-section">
    <div class="container" style="max-width:480px;">
      <div class="vs-auth-card">
        
        <!-- Header & Identity Context -->
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center rounded-3 mb-2" style="width:48px; height:48px; background-color:var(--vs-green-100); font-size:1.6rem;">
            🌿
          </div>
          <h1 class="h4 mb-1" style="color:var(--vs-text);">Log in to VeganSaathi</h1>
          <p class="text-muted-vs" style="font-size:0.9rem;">
            Access saved places, community reviews, and verified dining guides across Shegaon and SSGMCE.
          </p>
        </div>

        <form id="loginForm" novalidate>
          <!-- Email -->
          <div class="mb-3">
            <label for="loginEmail" class="form-label" style="font-weight:600; font-size:0.9rem;">
              Email address
            </label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted-vs">✉️</span>
              <input
                type="email"
                class="form-control border-start-0 ps-1"
                id="loginEmail"
                placeholder="e.g. arjundabbe531@gmail.com"
                autocomplete="email"
                required
              >
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label for="loginPassword" class="form-label" style="font-weight:600; font-size:0.9rem;">
                Password
              </label>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted-vs">🔒</span>
              <input
                type="password"
                class="form-control border-start-0 ps-1"
                id="loginPassword"
                placeholder="••••••••••••"
                autocomplete="current-password"
                required
              >
            </div>
          </div>

          <!-- Remember + Forgot Password -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="rememberMe"
              >
              <label
                class="form-check-label text-muted-vs"
                for="rememberMe"
                style="font-size:0.88rem;"
              >
                Remember me
              </label>
            </div>

            <a
              href="#"
              id="forgotPasswordLink"
              style="font-size:0.88rem; font-weight:600;"
            >
              Forgot password?
            </a>
          </div>

          <!-- Login Submit -->
          <button
            type="submit"
            class="btn btn-vs-primary w-100 py-2 mb-3"
            style="font-size:0.95rem;"
          >
            Log in to VeganSaathi →
          </button>

          <!-- Divider -->
          <div class="position-relative text-center my-3">
            <hr style="border-color:var(--vs-border);">
            <span class="position-absolute top-50 start-50 translate-middle px-3 bg-white text-muted-vs" style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.04em;">
              or continue with
            </span>
          </div>

          <!-- Google Sign-in -->
          <button
            type="button"
            id="googleSignInButton"
            class="btn-google mb-2"
          >
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
            </svg>
            <span>Sign in with Google</span>
          </button>

          <!-- Feedback note -->
          <div
            id="loginFeedback"
            class="vs-form-note mt-3 d-none"
          ></div>
        </form>

        <div class="text-center mt-4 pt-3 border-top" style="font-size:0.9rem;">
          <span class="text-muted-vs">New to VeganSaathi?</span>
          <a href="register.html" style="font-weight:700;">Create an account</a>
        </div>

      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <!-- Bootstrap -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- VeganSaathi scripts -->
  <script src="js/components.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/auth-ui.js"></script>

</body>
</html>
