<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Register — VeganSaathi</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link href="css/styles.css" rel="stylesheet">

  <script>
    window.VS_BASE = "";
    window.VS_ACTIVE_PAGE = "";
  </script>
</head>

<body>

  <div id="navbar-placeholder"></div>

  <section class="vs-section">
    <div class="container" style="max-width:520px;">

      <div class="vs-card p-4">

        <h1 class="h4 mb-3">
          Create your VeganSaathi account
        </h1>

        <form id="registerForm" novalidate>

          <!-- Name -->
          <div class="mb-3">
            <label for="registerName" class="form-label">
              Name
            </label>

            <input
              type="text"
              class="form-control"
              id="registerName"
              autocomplete="name"
              required
            >
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="registerEmail" class="form-label">
              Email
            </label>

            <input
              type="email"
              class="form-control"
              id="registerEmail"
              autocomplete="email"
              required
            >
          </div>

          <!-- Passwords -->
          <div class="row">

            <div class="col-sm-6 mb-3">

              <label
                for="registerPassword"
                class="form-label"
              >
                Password
              </label>

              <input
                type="password"
                class="form-control"
                id="registerPassword"
                autocomplete="new-password"
                minlength="6"
                required
              >

            </div>

            <div class="col-sm-6 mb-3">

              <label
                for="registerConfirm"
                class="form-label"
              >
                Confirm password
              </label>

              <input
                type="password"
                class="form-control"
                id="registerConfirm"
                autocomplete="new-password"
                minlength="6"
                required
              >

            </div>

          </div>

          <!-- Dietary preference -->
          <div class="mb-3">

            <label
              for="registerDiet"
              class="form-label"
            >
              Dietary preference
            </label>

            <select
              id="registerDiet"
              class="form-select"
              required
            >
              <option value="">Select one</option>
              <option value="vegan">Vegan</option>
              <option value="vegetarian">Vegetarian</option>
              <option value="eggetarian">Eggetarian</option>
              <option value="jain">Jain</option>
              <option value="unspecified">
                Prefer not to specify
              </option>
            </select>

          </div>

          <!-- Register -->
          <button
            type="submit"
            class="btn btn-vs-primary w-100 mb-2"
          >
            Create Account
          </button>

          <!-- Feedback -->
          <div
            id="registerFeedback"
            class="vs-form-note mt-2 d-none"
          ></div>

        </form>

        <p
          class="text-center mt-3 mb-0"
          style="font-size:0.9rem;"
        >
          Already have an account?
          <a href="login.html">Log in</a>
        </p>

      </div>

    </div>
  </section>

  <div id="footer-placeholder"></div>

  <!-- Bootstrap -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- Existing VeganSaathi scripts -->
  <script src="js/mock-data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>

  <!-- Phase 4 Firebase Authentication -->
  <!-- IMPORTANT: load only once and as a module -->
  <script type="module" src="js/auth-ui.js"></script>

</body>
</html>
